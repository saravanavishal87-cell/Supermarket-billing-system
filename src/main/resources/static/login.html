<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rahul Stores POS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="header">
    <div>
      <h1>Rahul Stores POS</h1>
      <div class="subtitle">Smart Billing & POS System</div>
    </div>
  </div>

  <div class="login-body">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="sub">Sign in to continue billing</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div id="errorMsg" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:12px;">Sign In</button>
      </form>

      <p class="hint">Demo Credentials: admin / admin123 or cashier / cashier123</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (getUser()) window.location.href = '/dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';

      try {
        const user = await apiPost('/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        });
        sessionStorage.setItem('user', JSON.stringify(user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
