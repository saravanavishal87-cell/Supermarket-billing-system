<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Rahul Stores POS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="products-layout">
    <div class="card">
      <h3 style="margin-bottom:16px;" id="formTitle">Add / Edit Product</h3>
      <form id="productForm">
        <input type="hidden" id="editOriginalId" value="">
        <div class="form-group">
          <label for="productId">Product ID <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">(Auto-generated if empty, or edit ID)</span></label>
          <input type="number" id="productId" min="1" placeholder="Auto-generated or custom ID">
        </div>
        <div class="form-group">
          <label>Barcode</label>
          <input type="text" id="barcode" required>
        </div>
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="productName" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="categoryId">
            <option value="1">Groceries</option>
            <option value="2">Beverages</option>
            <option value="3">Snacks</option>
            <option value="4">Dairy</option>
            <option value="5">Personal Care</option>
          </select>
        </div>
        <div class="form-group">
          <label>Price (Rs.)</label>
          <input type="number" id="price" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <label>Stock Qty</label>
          <input type="number" id="stockQty" min="0" required>
        </div>
        <div class="form-group">
          <label>Unit</label>
          <input type="text" id="unit" value="pcs">
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button type="submit" class="btn btn-primary" id="saveProductBtn">Save Product</button>
          <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
          <button type="button" class="btn btn-danger" onclick="deleteProduct()">Delete</button>
        </div>
      </form>
    </div>

    <div class="card" style="overflow:auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Barcode</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Unit</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script>
    const user = requireAuth();
    if (user.role !== 'ADMIN') {
      alert('Only Admin can manage products.');
      window.location.href = '/dashboard.html';
    }
    document.getElementById('header').innerHTML = renderHeader('Product Management', 'Add, edit and manage Rahul Stores inventory');

    let products = [];

    async function loadProducts() {
      try {
        products = await apiGet('/products');
        const tbody = document.getElementById('productTable');
        tbody.innerHTML = products.map(p => `
          <tr onclick="selectProduct(${p.productId})" id="prod-row-${p.productId}" style="cursor:pointer;">
            <td><strong>#${p.productId}</strong></td>
            <td>${p.barcode || ''}</td>
            <td><strong>${p.productName}</strong></td>
            <td>${p.categoryName || ''}</td>
            <td>${formatCurrency(p.price)}</td>
            <td>${p.stockQty}</td>
            <td>${p.unit}</td>
            <td onclick="event.stopPropagation();">
              <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.8rem;" onclick="selectProduct(${p.productId})">✏️ Edit</button>
            </td>
          </tr>
        `).join('');
      } catch (err) { alert(err.message); }
    }

    function selectProduct(id) {
      const p = products.find(x => x.productId === id);
      if (!p) return;
      document.getElementById('editOriginalId').value = p.productId;
      document.getElementById('productId').value = p.productId;
      document.getElementById('barcode').value = p.barcode;
      document.getElementById('productName').value = p.productName;
      document.getElementById('categoryId').value = p.categoryId;
      document.getElementById('price').value = p.price;
      document.getElementById('stockQty').value = p.stockQty;
      document.getElementById('unit').value = p.unit;
      document.getElementById('formTitle').textContent = `Edit Product (Editing ID #${p.productId})`;
      document.getElementById('saveProductBtn').textContent = 'Update Product';

      document.querySelectorAll('#productTable tr').forEach(r => r.style.background = '');
      const activeRow = document.getElementById(`prod-row-${p.productId}`);
      if (activeRow) activeRow.style.background = 'rgba(79, 70, 229, 0.08)';
    }

    function clearForm() {
      document.getElementById('editOriginalId').value = '';
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('unit').value = 'pcs';
      document.getElementById('formTitle').textContent = 'Add / Edit Product';
      document.getElementById('saveProductBtn').textContent = 'Save Product';
      document.querySelectorAll('#productTable tr').forEach(r => r.style.background = '');
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawId = document.getElementById('productId').value.trim();
      const product = {
        productId: rawId ? parseInt(rawId) : 0,
        barcode: document.getElementById('barcode').value.trim(),
        productName: document.getElementById('productName').value.trim(),
        categoryId: parseInt(document.getElementById('categoryId').value),
        price: parseFloat(document.getElementById('price').value),
        stockQty: parseInt(document.getElementById('stockQty').value),
        unit: document.getElementById('unit').value.trim()
      };

      try {
        const origId = document.getElementById('editOriginalId').value;
        if (origId) {
          const res = await apiPut('/products/' + origId, product);
          alert(res && res.message ? res.message : 'Product updated!');
        } else {
          const res = await apiPost('/products', product);
          alert(res && res.message ? res.message : 'Product added!');
        }
        clearForm();
        loadProducts();
      } catch (err) { alert(err.message); }
    });

    async function deleteProduct() {
      const origId = document.getElementById('editOriginalId').value;
      if (!origId) { alert('Select a product to delete.'); return; }
      if (!confirm(`Delete product #${origId}? This cannot be undone.`)) return;
      try {
        await apiDelete('/products/' + origId);
        clearForm();
        loadProducts();
      } catch (err) { alert(err.message); }
    }

    loadProducts();
  </script>
</body>
</html>
